name: ViewpointReceipts
options:
  bundleIdPrefix: com.viewpoint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ViewpointReceipts:
    type: application
    platform: iOS
    sources:
      - path: ViewpointReceipts
        excludes:
          - "Resources/Info.plist"
          - "Resources/ViewpointReceipts.entitlements"
    resources:
      - path: ViewpointReceipts/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: ViewpointReceipts/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ViewpointReceipts/Resources/ViewpointReceipts.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.viewpoint.receipts
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
